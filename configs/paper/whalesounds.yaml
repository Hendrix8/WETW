dataset:
  dataset_name: whalesounds
  dim_series: 2500
  dists_mode: manual
  refine:
    steps: 100000
    schedule: cosine
    anchors: 20000
    hard_fraction: 0.5
    hard_rank: 2000
encoder_model:
  dim_emb: 128
  dim_en_latent: 128
  num_en_resblock: 6
  num_en_channels: 64
  conv_kernel_size: 7
  activation_conv: relu
  activation_linear: relu
  dilation_type: exponential
  resblock_pre_activation: true
  layernorm_type: layer_norm
  layernorm_elementwise_affine: true
  global_pooling: max
  time_fusion: true
  time_fusion_hidden_dim: 64
  optimizer: sgd
  lr_init: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.01
  wd_max: 0.1
  wd_min: 0.001
  weight_decay_mode: linear
  mode: min
  lr_reduce_factor: 0.5
  sched_pat: 10
  threshold: 0.0001
  threshold_mode: rel
  sched_cooldown: 0
  scheduler:
    name: plateau
    warmup_epochs: 5
  flexible_kernels: false
  residual_strided_convs: false
  weightnorm_type: none
  weightnorm_dim: 0
  relu_slope: 0.01
  prelu_params: 1
  eps: 1.0e-06
  adanorm_k: 5
  adanorm_scale: 1.0
  dilation_base: 2
  dilation_constant: 2
  dilation_slope: 2
  backbone: resnet
  projection_head:
    type: mlp
    hidden_dim: 96
    activation: gelu
    dropout: 0.0
  auto_width_max: 512
  strided_conv_num: None
  encoder_normalize_embedding: false
  layernorm2_znorm: true
  time_fusion_pre_norm: false
  time_fusion_weight_norm: false
  multi_temporal_head_enabled: true
  multi_temporal_head_kernels:
  - 3
  - 45
  - 95
  pooling_type: max
  momentum: 0.9
  time_fusion_pool_target: 256
weight_model:
  approximator: wetw
  hidden_dim: 128
  num_tokens: 16
  token_dim: 8
  weight_model_layers: 2
  weight_model_channels: 128
  kernel_size: 3
  use_relational_tokens: true
  token_pooling: mean
  cross_attention_layers: 1
  cross_attention_heads: 4
  weight_mode: pairwise
  strictly_positive_weights: true
  use_weight_templates: true
  num_weight_templates: 32
  normalize_weights: true
  optimizer: adam
  lr_init: 5.0e-05
  min_lr: 1.0e-06
  mode: min
  lr_reduce_factor: 0.5
  lr_scheduler_patience: 15
  threshold: 0.0001
  threshold_mode: rel
  sched_cooldown: 0
  scheduler:
    name: plateau
    warmup_epochs: 5
  weightnorm_type: none
  weightnorm_dim: 0
  relu_slope: 0.01
  eps: 1.0e-06
  cross_attention_dropout: 0.0
  token_self_attention_layers: 0
  token_self_attention_dropout: 0.1
  seanet_metric:
    enabled: true
    normalize_weights_sum_to_embed_dim: true
    scale_weighted_distance_by_inv_sqrt_dim: true
training:
  size_batch: 16
  num_epoch: 500
  valid_split: 0.2
  warping_window: 0.1
  early_stopping: true
  early_stopping_patience: 50
  early_stopping_min_delta: 0.0001
  start_sched_after_epoch: 10
  grad_clip: 1.0
  train_all_pairs: false
  encoder_joint_train_epochs: 100
  distance_loss_type: relative_huber
  relative_error_epsilon: 1.0e-06
  relative_loss_huber_delta: 0.1
  training_scale_dists: true
  dist_pred_scale_factor: 1.0
  lb_penalty_weight: 0.01
  underestimation_penalty_weight: 0.0
  variance_penalty_weight: 0.0
  wetw_weight_diversity_weight: 0.001
  wetw_weight_diversity_mode: shortfall
  use_ranking_loss: false
  ranking_loss_weight: 0.1
  ranking_loss_margin: 0.05
  ranking_loss_type: hinge
  ranking_temperature: 1.0
  encoder_pretrain_epochs: 50
  encoder_pretrain_lr: 0.001
  encoder_pretrain_use_identity: true
  max_wall_hours: 24.0
  embed_batch: 32
  weucl_dist_chunk_num: 1000000
  test_split: 0.8
  target_dist_function: dtw
  force_recalculate_dtw_train: false
  early_stopping_max_wait_after_patience: 50
  relative_error_batch_var_weight: 0.0
  pairwise_rel_error_epsilon: 1.0e-06
  pairwise_rel_error_mean_penalty_weight: 0.0
  pairwise_rel_error_var_penalty_weight: 0.0
  wetw_weight_diversity_floor: 1.0e-06
  wetw_weight_diversity_neglog_cap: 20.0
  pred_distance_learned_calib: bias
  pred_distance_learned_bias_init: 0.0
  pred_distance_learned_reg_weight: 0.0
  pred_distance_calib_train_when_encoder_frozen: true
  batch_loading_size: 1000000
  seasam_cardinality: 8
  dim_seasam: 8
  max_train_samples: 100000
  max_valid_samples: 60000
  temporal_head_enabled: true
  scale_dists: true
  scale_distances_by_dim: false
  eval_test_relative_error: false
  wetw_query_pair_residual_enabled: false
  wetw_query_pair_residual_scale: 0.1
  wetw_query_pair_residual_hidden: 128
  listwise_simsearch_weight: 0.0
  listwise_simsearch_temperature: 1.0
  listwise_simsearch_n_anchors: 4
  listwise_simsearch_n_candidates: 24
  pairwise_rank_margin_weight: 0.0
system:
  device: cpu
  torch_manual_seed: 42
  torch_cuda_manual_seed: 42
  detect_anomaly: false
  wandb_mode: disabled
logging:
  logging_level: INFO
  log_filepath: experiment.log
  use_wandb: false
release:
  dataset: whalesounds
  variant: full
  generator_hidden: 128
  seed: 42
  head_selection:
    queries: 300
    rho: 0.005
    tie_break_rhos:
    - 0.002
    - 0.01
  source_protocol: light-generator-20261030 + validation-selected hard-negative refinement-20261106
  reference_layout: false
